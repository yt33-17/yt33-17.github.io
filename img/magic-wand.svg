<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0c3fc"/>
      <stop offset="50%" style="stop-color:#be93f0"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
    <radialGradient id="tipGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="40%" style="stop-color:#ffd6e8"/>
      <stop offset="80%" style="stop-color:#ff8ab8"/>
      <stop offset="100%" style="stop-color:#e91e63"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 杆 -->
  <line x1="20" y1="20" x2="10" y2="10" stroke="url(#wandGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 球 -->
  <circle cx="10" cy="10" r="5" fill="#ff8ab8" opacity="0.3" filter="url(#glow)"/>
  <circle cx="10" cy="10" r="4" fill="url(#tipGrad)"/>
  <circle cx="8.5" cy="8.5" r="1.3" fill="#fff" opacity="0.9"/>
  <circle cx="7.8" cy="7.8" r="0.7" fill="#fff" opacity="0.7"/>
</svg>
